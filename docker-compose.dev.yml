# Development profile — Nuxt via `bun run dev` (hot reload).
# All runtime data lives under build/dns01-stack/.data/{server,client,letsencrypt}.
# Usage:
#   bun run docker:dev
#   docker compose -f docker-compose.dev.yml --profile dev up --build
services:
  dns01-stack:
    profiles:
      - dev
    build:
      context: build/dns01-stack
      dockerfile: Dockerfile.dev
    image: harianto/dns01-stack:dev
    container_name: dns01-stack-dev
    working_dir: /app
    command:
      - sh
      - -c
      - bun install && exec bun run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
      - "15353:15353"
      - "15353:15353/udp"
    volumes:
      - ./build/dns01-stack:/app
      - dns01_dev_node_modules:/app/node_modules
    environment:
      - TZ=${TZ:-UTC}
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      - ADMINISTRATOR_PASSWORD=${ADMINISTRATOR_PASSWORD:-}
      - DNS01_CONFIG=.data/server/config.cfg
      - DNS01_LISTEN=0.0.0.0:15353
      - DNS01_CLIENTSTORAGE=.data/client/clientstorage.json
      - DNS01_CLIENT_ROOT=.data/client
      - DNS01_DOMAINS=.data/client/domains.txt
      - DNS01_CERT_SETTINGS=.data/client/cert-settings.json
      - DNS01_LETSENCRYPT=.data/letsencrypt
      - ACMEDNS_URL=${ACMEDNS_URL:-http://127.0.0.1:3000}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-admin@example.com}
      - RENEW_INTERVAL=${RENEW_INTERVAL:-12}
      - CERTS_ACME_ENABLED=${CERTS_ACME_ENABLED:-true}
      - NUXT_PUBLIC_DEFAULT_ACMEDNS_URL=${NUXT_PUBLIC_DEFAULT_ACMEDNS_URL:-${ACMEDNS_URL:-http://127.0.0.1:3000}}
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

volumes:
  dns01_dev_node_modules:
    name: dns01_dev_node_modules
