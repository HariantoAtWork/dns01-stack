[general]
# Production first-boot template. Copied to `/var/lib/dns01-stack/server/config.cfg`
# when missing (Docker image ships this as `/app/config.cfg.default`).
# Code defaults (when a key is omitted) live in server/utils/config.ts DEFAULTS.
#
# Production layout:
#   /var/lib/dns01-stack/server/  — this file + acme-dns.db
#   /var/lib/dns01-stack/client/  — Nuxt client plugin data
#   /etc/letsencrypt/             — PEMs (compose bind)
#
# Local / docker:dev uses seed/config.dev.cfg → project `.data/`.

# listen — optional; code default "0.0.0.0:53".
# Note that systemd-resolved may reserve port 53 on 127.0.0.53.
# Override host/port via DNS01_LISTEN / DNS01_DNS_PORT.
listen = "0.0.0.0:53"
# protocol — optional; code default "both".
protocol = "both"
# domain — optional to parse (code default "auth.example.org"); set your real zone for production.
domain = "auth.example.test"
nsname = "auth.example.test"
nsadmin = "admin.example.test"
records = [
    "auth.example.test. A 198.51.100.1",
    "auth.example.test. NS auth.example.test.",
]
debug = true

[database]
engine = "sqlite"
# Compose mounts host ./data/server → /var/lib/dns01-stack/server
connection = "/var/lib/dns01-stack/server/acme-dns.db"

[api]
ip = "0.0.0.0"
disable_registration = false
port = "80"
tls = "none"
corsorigins = [
    "*"
]
use_header = false
header_name = "X-Forwarded-For"

[logconfig]
loglevel = "debug"
logtype = "stdout"
logformat = "text"
